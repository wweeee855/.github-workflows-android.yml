name: Flexible Android Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Пробуем Java 17 (стандарт для большинства современных приложений)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        chmod +x ./gradlew || true
        chmod +x app/gradlew || true

    # Собираем приложение. Если падает — пробуем альтернативную команду сборки
    - name: Build Android App
      run: |
        ./gradlew assembleDebug --no-daemon || ./gradlew assembleRelease --no-daemon || cd app && ./gradlew assembleDebug --no-daemon
      continue-on-error: true

    # Поиск ВСЕХ скомпилированных APK файлов в любых папках
    - name: Upload any found APKs
      uses: actions/upload-artifact@v4
      with:
        name: finished-android-apps
        path: "**/*.apk"
        
